<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Inteli Social</title><style>:root{--bg:#f4f7fb;--card:#fff;--ink:#12233f;--muted:#62708a;--nav:#0b132b;--accent:#246bfd;--ok:#198754}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink)}header{background:var(--nav);color:#fff;padding:20px 18px 16px;position:sticky;top:0}header h1{font-size:22px;margin:0}header p{margin:4px 0 0;color:#c8d3ea;font-size:13px}.wrap{padding:16px;max-width:760px;margin:auto}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.card{background:var(--card);border-radius:16px;padding:15px;box-shadow:0 6px 22px rgba(20,40,80,.07);margin-bottom:13px}.metric b{display:block;font-size:24px}.metric span,label,.small{font-size:12px;color:var(--muted)}h2{font-size:17px;margin:0 0 12px}label{display:block;margin:9px 0 5px}input,textarea{width:100%;border:1px solid #dbe2ee;border-radius:11px;padding:11px;font:inherit;background:#fff}textarea{min-height:105px}.platforms,.actions{display:flex;gap:8px}.pill{border:1px solid #dce4f0;border-radius:999px;padding:9px 12px;background:#fff}.pill input{width:auto;margin-right:6px}.actions{margin-top:12px}.btn{border:0;border-radius:11px;padding:11px 14px;font-weight:700;flex:1}.primary{background:var(--accent);color:#fff}.secondary{background:#e9eef8}.post{border-top:1px solid #edf0f5;padding:12px 0}.top{display:flex;justify-content:space-between;gap:8px;font-size:12px}.tag{background:#edf3ff;color:#2457b8;padding:4px 7px;border-radius:999px}.status{font-weight:700;color:var(--ok)}.post p{font-size:14px;white-space:pre-wrap}.demo{background:#fff4d6;color:#7d5b00;border:1px solid #ffe09a;padding:10px 12px;border-radius:12px;font-size:12px;margin-bottom:13px}</style></head><body><header><h1>Inteli Social</h1><p>Instagram + LinkedIn · Demo móvil</p></header><main class="wrap"><div class="demo">Modo DEMO: podés crear, guardar y programar publicaciones. No publica todavía en cuentas reales.</div><div class="grid"><div class="card metric"><b id="count">0</b><span>Publicaciones</span></div><div class="card metric"><b id="scheduled">0</b><span>Programadas</span></div></div><section class="card"><h2>Nueva publicación</h2><label>Redes</label><div class="platforms"><label class="pill"><input type="checkbox" id="ig" checked>Instagram</label><label class="pill"><input type="checkbox" id="li" checked>LinkedIn</label></div><label>Texto</label><textarea id="text" placeholder="Escribí la publicación..."></textarea><label>Fecha y hora</label><input id="date" type="datetime-local"><div class="actions"><button class="btn secondary" onclick="add('Borrador')">Guardar borrador</button><button class="btn primary" onclick="add('Programada')">Programar</button></div></section><section class="card"><h2>Contenido</h2><div id="posts"></div></section></main><script>const key='inteli-social-posts-v1';let posts=JSON.parse(localStorage.getItem(key)||'[]');function save(){localStorage.setItem(key,JSON.stringify(posts));render()}function add(status){const t=text.value.trim(),p=[];if(ig.checked)p.push('Instagram');if(li.checked)p.push('LinkedIn');if(!t)return alert('Escribí el texto.');if(!p.length)return alert('Elegí una red.');if(status==='Programada'&&!date.value)return alert('Elegí fecha y hora.');posts.unshift({id:Date.now(),text:t,platforms:p,status,date:date.value||null});text.value='';save()}function del(id){posts=posts.filter(x=>x.id!==id);save()}function esc(s){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}function render(){count.textContent=posts.length;scheduled.textContent=posts.filter(x=>x.status==='Programada').length;document.getElementById('posts').innerHTML=posts.length?posts.map(p=>`<div class="post"><div class="top"><span class="tag">${p.platforms.join(' + ')}</span><span class="status">${p.status}</span></div><p>${esc(p.text)}</p><div class="top"><span class="small">${p.date?new Date(p.date).toLocaleString('es-AR'):'Sin fecha'}</span><button onclick="del(${p.id})" style="border:0;background:none;color:#c0392b">Eliminar</button></div></div>`).join(''):'<p class="small">Todavía no hay publicaciones.</p>'}render();</script></body></html>
